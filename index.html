<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detektif Hoaks WA 🕵️‍♂️</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen font-sans antialiased">

    <!-- Container Utama -->
    <div class="max-w-3xl mx-auto px-4 py-10">
        
        <!-- Header -->
        <header class="text-center mb-10">
            <h1 class="text-4xl font-extrabold text-teal-700 flex justify-center items-center gap-2 mb-2">
                Detektif Hoaks WA 🕵️‍♂️
            </h1>
            <p class="text-gray-600 text-lg">
                Cek keaslian pesan broadcast WhatsApp secara instan menggunakan kecerdasan buatan.
            </p>
        </header>

        <!-- Main Card Container -->
        <div class="bg-white rounded-2xl shadow-xl p-6 md:p-8 border border-gray-100">
            
            <!-- Label & Input Form -->
            <div class="mb-6">
                <label for="pesanInput" class="block text-gray-700 font-semibold mb-2 text-sm md:text-base">
                    Masukkan / Paste Teks Pesan WA yang Mencurigakan:
                </label>
                <textarea 
                    id="pesanInput" 
                    rows="6" 
                    class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-teal-500 focus:border-teal-500 text-gray-800 placeholder-gray-400 shadow-inner transition resize-y"
                    placeholder="Contoh: Selamat! Nomor Anda memenangkan undian 100 juta dari Shopee. Klik link berikut untuk mengklaim..."></textarea>
            </div>

            <!-- Action Button -->
            <div class="mb-6">
                <button 
                    id="btnAnalisis" 
                    onclick="analisisPesan()"
                    class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-6 rounded-xl shadow-md transition-all transform hover:-translate-y-0.5 active:translate-y-0 flex justify-center items-center gap-2 text-lg">
                    <span>Analisis Pesan</span>
                </button>
            </div>

            <!-- Loading Indicator -->
            <div id="loadingIndicator" class="hidden text-center py-6">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-teal-500 border-t-transparent mb-2"></div>
                <p class="text-teal-700 font-medium animate-pulse">Sedang menganalisis dengan AI...</p>
            </div>

            <!-- Result Box -->
            <div id="resultBox" class="hidden mt-6 p-6 rounded-xl border-2 transition-all">
                <h3 class="text-xl font-bold mb-3 flex items-center gap-2" id="resultStatusTitle">
                    Hasil Analisis
                </h3>
                <div id="resultText" class="text-gray-700 leading-relaxed whitespace-pre-line text-sm md:text-base">
                </div>
            </div>

        </div>

        <!-- Footer -->
        <footer class="text-center mt-12 text-sm text-gray-400">
            <p>&copy; 2026 Detektif Hoaks WA. Dibuat untuk tugas kuliah.</p>
        </footer>

    </div>

    <!-- MEMANGGIL FILE LOGIKA JAVASCRIPT JALUR EKSTERNAL -->
    <script src="script.js"></script>
</body>
</html>
